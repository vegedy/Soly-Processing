name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies and service
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --platform linux/amd64 --tag soly-processing:ci .
      - name: Smoke-test installed service outside the source tree
        run: docker run --rm --network none --hostname localhost --workdir /tmp --entrypoint /opt/python/bin/python3 soly-processing:ci -I /opt/soly/smoke_test.py
