[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "soly-processing"
version = "0.1.0"
description = "Echtzeitverarbeitung und Aggregation von PV- und Batteriedaten mit PyFlink für Soly"
readme = "README.md"
requires-python = "==3.12.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "apache-flink==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[project.urls]
Repository = "https://github.com/vegedy/Soly-Processing"

[tool.setuptools.packages.find]
where = ["src"]
include = ["soly_processing*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
